sonar.projectKey=secureflow
sonar.projectName=SecureFlow
sonar.sourceEncoding=UTF-8

sonar.sources=app
sonar.tests=tests
sonar.python.version=3.12

# the dashboard is a few hundred lines of plain HTML/CSS/JS with no build step;
# analysing it would need Node.js on the scanner, so we keep it out of scope
sonar.exclusions=app/static/**

# duplicated setup in tests (parametrised payload tables) is fine
sonar.cpd.exclusions=tests/**

sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.xunit.reportPath=reports/junit-*.xml
