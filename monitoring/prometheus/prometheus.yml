global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: secureflow
    metrics_path: /metrics
    static_configs:
      - targets: ["secureflow-staging:8000"]
        labels:
          env: staging
      - targets: ["secureflow-prod:8000"]
        labels:
          env: production

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
